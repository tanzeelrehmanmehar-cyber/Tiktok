<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TikTok Downloader</title>
  <style>
    body { font-family: Arial; background: #0f0f0f; color: #fff; text-align: center; padding: 40px; }
    form { margin-top: 20px; }
    input[type=text] { width: 80%; padding: 10px; border-radius: 6px; border: none; }
    button { padding: 10px 20px; margin-top: 10px; background: #ff0050; color: white; border: none; border-radius: 6px; cursor: pointer; }
    a.download-link { display: block; margin-top: 20px; color: #00ffcc; font-size: 18px; text-decoration: none; }
    .error { color: #ff4444; margin-top: 10px; }
  </style>
</head>
<body>
  <h1>🎵 TikTok Video Downloader</h1>
  <form method="POST">
    <input type="text" name="url" placeholder="Paste TikTok link here" required>
    <br>
    <button type="submit">Download</button>
  </form>

  {% with messages = get_flashed_messages() %}
    {% if messages %}
      <div class="error">{{ messages[0] }}</div>
    {% endif %}
  {% endwith %}

  {% if download_url %}
    <a class="download-link" href="{{ download_url }}" download>⬇️ Click to Download: {{ title }}</a>
  {% endif %}
</body>
</html>
